services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsetix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsetix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsetix_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pulsetix_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsetix} -d ${POSTGRES_DB:-pulsetix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulsetix-net

  redis:
    image: redis:7.4-alpine
    container_name: pulsetix-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pulsetix-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pulsetix-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulsetix-net

  kafka:
    image: apache/kafka:3.8.0
    container_name: pulsetix-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - pulsetix-net

  catalog-service:
    build: ./services/catalog-service
    container_name: pulsetix-catalog
    environment:
      REGION_ID: ${REGION_ID:-ap-south-local}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulsetix}:${POSTGRES_PASSWORD:-pulsetix_secret}@postgres:5432/${POSTGRES_DB:-pulsetix_db}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pulsetix-net

  booking-service:
    build: ./services/booking-service
    container_name: pulsetix-booking
    environment:
      REGION_ID: ${REGION_ID:-ap-south-local}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - pulsetix-net

  payment-worker:
    build: ./services/payment-worker
    container_name: pulsetix-payment-worker
    environment:
      REGION_ID: ${REGION_ID:-ap-south-local}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      KAFKA_BOOTSTRAP: kafka:9092
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulsetix}:${POSTGRES_PASSWORD:-pulsetix_secret}@postgres:5432/${POSTGRES_DB:-pulsetix_db}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - pulsetix-net

  sync-service:
    build: ./services/sync-service
    container_name: pulsetix-sync
    environment:
      REGION_ID: ${REGION_ID:-ap-south-local}
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - pulsetix-net

  region-relay:
    build: ./services/region-relay
    container_name: pulsetix-region-relay
    environment:
      REGION_ID: ${REGION_ID:-ap-south-local}
      PEER_REGION_URL: ${PEER_REGION_URL:-}
      RELAY_SECRET: ${RELAY_SECRET:-pulsetix-sync-secret-2026}
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulsetix}:${POSTGRES_PASSWORD:-pulsetix_secret}@postgres:5432/${POSTGRES_DB:-pulsetix_db}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - pulsetix-net

  frontend:
    build: ./frontend
    container_name: pulsetix-frontend
    networks:
      - pulsetix-net

  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: pulsetix-nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - catalog-service
      - booking-service
      - sync-service
      - region-relay
    networks:
      - pulsetix-net

volumes:
  postgres_data:

networks:
  pulsetix-net:
    driver: bridge
